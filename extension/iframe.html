<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassCraft Credential Selector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: white;
      color: #334155;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      height: 100vh;
      overflow-y: auto;
    }
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f1f5f9;
    }
    .title-bar h3 { font-size: 13px; font-weight: 800; color: #1e293b; }
    .close-btn { background: none; border: none; font-size: 14px; cursor: pointer; color: #94a3b8; }
    .close-btn:hover { color: #64748b; }

    /* Anti-Phishing Alert Banner */
    .phishing-warning {
      background: #fef2f2;
      border: 1.5px solid #ef4444;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #991b1b;
      line-height: 1.4;
    }
    .phishing-warning strong { font-weight: 800; display: block; margin-bottom: 2px; }

    .item-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .item-card:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .item-title { font-size: 12px; font-weight: 700; color: #1e293b; }
    .item-user { font-size: 11px; color: #64748b; margin-top: 1px; }
    .badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 4px;
    }
    .badge-match { background: #dcfce7; color: #166534; }
    .badge-mismatch { background: #fee2e2; color: #991b1b; }
    .empty-msg { font-size: 11px; color: #94a3b8; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="title-bar">
    <h3>🛡️ Select PassCraft Account</h3>
    <button id="close-modal" class="close-btn">✕</button>
  </div>

  <div id="phishing-banner" class="phishing-warning hidden">
    <strong>🚨 PHISHING WARNING DETECTED</strong>
    <span id="phishing-desc">Current website domain does not match the saved domain for this account!</span>
  </div>

  <div id="items-container">
    <div class="empty-msg">Loading saved vault items...</div>
  </div>

  <script src="iframe.js"></script>
</body>
</html>
