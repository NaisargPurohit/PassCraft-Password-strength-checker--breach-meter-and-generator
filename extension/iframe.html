<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassCraft Credential Selector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="title-bar">
    <h3>🛡️ Select PassCraft Account</h3>
    <button id="close-modal" class="close-btn">✕</button>
  </div>

  <div id="phishing-banner" class="phishing-warning hidden">
    <strong>🚨 PHISHING WARNING DETECTED</strong>
    <span id="phishing-desc">Current website domain does not match the saved domain for this account!</span>
  </div>

  <div id="items-container">
    <div class="empty-msg">Loading saved vault items...</div>
  </div>

  <script src="iframe.js"></script>
</body>
</html>
